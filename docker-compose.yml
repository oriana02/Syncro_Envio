version: "3.9"

services:
  # ──────────────────────────────────────────────
  #  Microservicio de Envíos
  #  Puerto: 8084
  #  DB: MySQL en Aiven (remoto)
  #  MQ: RabbitMQ en CloudAMQP (remoto)
  #  Email: MailerSend API (remoto)
  # ──────────────────────────────────────────────
  ms-envios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncro-ms-envios
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      # Base de datos — MySQL en Aiven
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # RabbitMQ — CloudAMQP
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

      # MailerSend — Notificaciones por email
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-no-reply@syncro.cl}

    env_file:
      - .env

networks:
  default:
    name: syncro-envios-net
    driver: bridge
